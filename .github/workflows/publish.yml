# Publishes wrolpi-mcp to PyPI when a v* tag is pushed.  Requires a PyPI project named
# wrolpi-mcp with this repository configured as a trusted publisher (no API token needed).
name: publish

on:
  push:
    tags: ["v*"]

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - run: uv publish
